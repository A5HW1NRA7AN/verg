spring.application.name=verg-telephony-service

# Postgres (can be shared with VERG DB, but can also be separate)
spring.datasource.url=jdbc:postgresql://localhost:5433/verg_db
spring.datasource.username=verg_user
spring.datasource.password=verg_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Telephony AMI ---
telephony.ami.enabled=false
telephony.ami.host=127.0.0.1
telephony.ami.port=5038
telephony.ami.username=
telephony.ami.secret=
telephony.ami.reconnect-initial-ms=2000
telephony.ami.reconnect-max-ms=60000
telephony.ami.read-timeout-ms=120000
telephony.ami.event-mask=call,system,user

telephony.lead-context-allowlist=from-twilio-missed-call

# Outbound lead registry endpoint (ngrok/cloud). Empty = no outbound POST, only DB log.
telephony.lead-registry.url=
telephony.lead-registry.api-key-header=
telephony.lead-registry.api-key-value=

telephony.dispatch.sweeper-enabled=true
telephony.dispatch.stale-after-seconds=300
telephony.dispatch.sweeper-interval-ms=60000

