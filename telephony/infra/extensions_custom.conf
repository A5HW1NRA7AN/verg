[from-twilio-missed-call]
; Inbound Twilio → FreePBX: ring, answer, greeting, hangup.
; Lead capture is handled by VERG via AMI (Hangup events) — see telephony/AMI_SETUP.md
; Optional legacy HTTP from dialplan is commented at the bottom of this file.

exten => _+.,1,NoOp(INCOMING CALL TO: ${EXTEN} FROM: ${CALLERID(num)})
exten => _+.,n,Set(__CALLED_NUM=${EXTEN})

exten => _+.,n,Ringing()
exten => _+.,n,Wait(2)

exten => _+.,n,Answer()
exten => _+.,n,Wait(1)

exten => _+.,n,Playback(custom/atc-greeting)

exten => _+.,n,Hangup()

exten => h,1,NoOp(Call ended — ingest via VERG AMI; context=${CONTEXT} uniqueid=${UNIQUEID})

; -----------------------------------------------------------------------------
; LEGACY (optional): dialplan CURL POST to a HTTP webhook (e.g. VERG_URL).
; Uncomment only if you are not using AMI ingest or need a parallel path.
; -----------------------------------------------------------------------------
;exten => h,n,Set(ISO_TIME=${STRFTIME(${EPOCH},GMT,%Y-%m-%dT%H:%M:%SZ)})
;exten => h,n,Set(VERG_PAYLOAD={"leadId":"${UNIQUEID}","callerNumber":"${CALLERID(num)}","calledNumber":"${CALLED_NUM}","callStartTime":"${ISO_TIME}","callDurationSeconds":0,"callStatus":"MISSED","leadSource":"Asterisk-MissedCall-Campaign"})
;exten => h,n,Set(CURLOPT(httptimeout)=5)
;exten => h,n,Set(CURLOPT(httpheader)=Content-Type: application/json)
;exten => h,n,Set(VERG_URL=https://your-verg-or-ngrok/webhooks/telephony/lead)
;exten => h,n,Set(VERG_RESPONSE=${CURL(${VERG_URL},${VERG_PAYLOAD})})
