[from-twilio-missed-call]
; 1. Intercept the call and save the dialed number for use in the 'h' extension
exten => _+.,1,NoOp(INCOMING TWILIO CALL TO: ${EXTEN} FROM: ${CALLERID(num)})
exten => _+.,n,Set(__CALLED_NUM=${EXTEN})

; 2. Ring for 2 seconds
exten => _+.,n,Ringing()
exten => _+.,n,Wait(2)

; 3. Answer the call (establishes audio channel so the caller can hear us)
exten => _+.,n,Answer()
exten => _+.,n,Wait(1)

; 4. Play the pre-recorded greeting message
exten => _+.,n,Playback(custom/atc-greeting)

; 5. Hang up (triggers the 'h' extension)
exten => _+.,n,Hangup()

; -------------------------------------------------------------------------
; The 'h' extension fires automatically after hangup
; -------------------------------------------------------------------------
exten => h,1,NoOp(Call ended. Generating JSON payload for VERG...)

; Format the timestamp into ISO 8601 UTC
exten => h,n,Set(ISO_TIME=${STRFTIME(${EPOCH},GMT,%Y-%m-%dT%H:%M:%SZ)})

; Construct the JSON Payload (using CALLED_NUM saved from the main flow)
exten => h,n,Set(VERG_PAYLOAD={"leadId":"${UNIQUEID}","callerNumber":"${CALLERID(num)}","calledNumber":"${CALLED_NUM}","callStartTime":"${ISO_TIME}","callDurationSeconds":0,"callStatus":"MISSED","leadSource":"Asterisk-MissedCall-Campaign"})
exten => h,n,NoOp(Payload: ${VERG_PAYLOAD})

; Configure cURL and send the POST request
exten => h,n,Set(CURLOPT(httptimeout)=5)
exten => h,n,Set(CURLOPT(httpheader)=Content-Type: application/json)

; IMPORTANT: Replace this URL with your actual VERG endpoint or webhook.site URL
exten => h,n,Set(VERG_URL=https://webhook.site/c7a90c37-e6b4-4f52-8c8a-1df85856e2a5)
exten => h,n,Set(VERG_RESPONSE=${CURL(${VERG_URL},${VERG_PAYLOAD})})

; Log result — if response is non-empty, the webhook succeeded
exten => h,n,GotoIf($["${VERG_RESPONSE}" != ""]?success:fail)

exten => h,n(fail),NoOp(ERROR: Webhook failed or returned empty response.)
exten => h,n,Hangup()

exten => h,n(success),NoOp(SUCCESS: Webhook response: ${VERG_RESPONSE})
exten => h,n,Hangup()
